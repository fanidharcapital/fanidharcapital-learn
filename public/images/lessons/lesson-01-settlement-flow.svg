<text x="247" y="174" fill="#d1fae5" font-family="monospace" font-size="11">- Anonymous Order Book</text>
<text x="247" y="193" fill="#d1fae5" font-family="monospace" font-size="11">- Price-Time Priority</text>
<text x="247" y="212" fill="#d1fae5" font-family="monospace" font-size="11">- Trade ID Generated</text>
<text x="247" y="236" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="600">Day T - Milliseconds</text>
