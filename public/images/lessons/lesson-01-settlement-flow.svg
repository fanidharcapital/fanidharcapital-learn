<text x="42" y="174" fill="#d1fae5" font-family="monospace" font-size="11">- Investor / Trader</text>
<text x="42" y="193" fill="#d1fae5" font-family="monospace" font-size="11">- SEBI Broker App</text>
<text x="42" y="212" fill="#d1fae5" font-family="monospace" font-size="11">- UCC + Margin Check</text>
<text x="42" y="236" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="600">Day T - Market Hours</text>
