<text x="42" y="38" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.8">SHREE FANIDHAR CAPITAL - VISUAL FLOW</text>
​<text x="28" y="72" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="700">Anatomy of an Indian Equity Trade (T to T+1)</text>
