​<svg viewBox="0 0 820 340" role="img" aria-labelledby="lesson01-title lesson01-desc" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
<title id="lesson01-title">Indian Equity Market Trade and T+1 Settlement Flow</title>
<desc id="lesson01-desc">Four-stage horizontal flow showing Order Entry via SEBI Broker, Matching at NSE or BSE, Novation at Clearing Corporation, and T+1 Settlement via Depositories and Clearing Banks.</desc>
